services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: myground-vaultwarden
    restart: unless-stopped
    ports:
      - "${BIND_IP}:${EXIT_PORT}:80"
    volumes:
      - ${STORAGE_data}:/data
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      SIGNUPS_ALLOWED: "false"
    healthcheck:
      test: curl -f http://localhost:80/alive || exit 1
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
