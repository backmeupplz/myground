services:
  plaintext:
    image: ghcr.io/backmeupplz/plaintext-server:latest
    container_name: myground-plaintext
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
      - "${BIND_IP}:${EXIT_PORT}:8080"
    environment:
      PLAINTEXT_URL: "${APP_PUBLIC_URL}"
      PLAINTEXT_SETUP_CODE: "${PLAINTEXT_SETUP_CODE}"
      PLAINTEXT_DB: /data/plaintext.db
    volumes:
      - ${STORAGE_data}:/data
