[metadata]
name = "Anytype"
description = "Self-hosted Anytype sync network — private local-first notes, docs, and spaces"
icon = "network"
website = "https://anytype.io"
category = "productivity"
backup_supported = false
tailscale_mode = "skip"
post_install_notes = """Anytype does not expose a web UI. After the stack is healthy, upload client.yml from this app's config storage volume into Anytype's Self-hosted network settings.\nSet External listen hosts to a reachable LAN or public address before first start if clients connect from outside this machine."""

[[install_variables]]
key = "EXTERNAL_LISTEN_HOSTS"
label = "External listen hosts"
input_type = "text"
required = true
default = "127.0.0.1"
description = "Space-separated hostnames or IP addresses written into Anytype's client.yml. Use a reachable LAN or public address for remote clients."

[[install_variables]]
key = "ANYTYPE_BIND_IP"
label = "Port bind IP"
input_type = "text"
required = true
default = "127.0.0.1"
description = "Host address Docker binds the any-sync TCP/UDP ports to. Use 0.0.0.0 only when this server should accept external connections."

[defaults]
ANY_SYNC_DOCKERCOMPOSE_TAG = "v7.0.0"
ANY_SYNC_NODE_VERSION = "v0.11.0"
ANY_SYNC_FILENODE_VERSION = "v0.11.0"
ANY_SYNC_COORDINATOR_VERSION = "v0.9.0"
ANY_SYNC_CONSENSUSNODE_VERSION = "v0.7.1"
ANY_SYNC_TOOLS_VERSION = "latest"
MONGO_VERSION = "7.0.28"
REDIS_VERSION = "7.2.0-v6"
MINIO_VERSION = "RELEASE.2024-07-04T14-25-45Z"
EXTERNAL_LISTEN_HOSTS = "127.0.0.1"
ANYTYPE_BIND_IP = "127.0.0.1"
ANY_SYNC_NODE_1_HOST = "any-sync-node-1"
ANY_SYNC_NODE_1_PORT = "1001"
ANY_SYNC_NODE_1_ADDRESSES = "any-sync-node-1:1001"
ANY_SYNC_NODE_1_QUIC_PORT = "1011"
ANY_SYNC_NODE_1_QUIC_ADDRESSES = "any-sync-node-1:1011"
ANY_SYNC_NODE_2_HOST = "any-sync-node-2"
ANY_SYNC_NODE_2_PORT = "1002"
ANY_SYNC_NODE_2_ADDRESSES = "any-sync-node-2:1002"
ANY_SYNC_NODE_2_QUIC_PORT = "1012"
ANY_SYNC_NODE_2_QUIC_ADDRESSES = "any-sync-node-2:1012"
ANY_SYNC_NODE_3_HOST = "any-sync-node-3"
ANY_SYNC_NODE_3_PORT = "1003"
ANY_SYNC_NODE_3_ADDRESSES = "any-sync-node-3:1003"
ANY_SYNC_NODE_3_QUIC_PORT = "1013"
ANY_SYNC_NODE_3_QUIC_ADDRESSES = "any-sync-node-3:1013"
ANY_SYNC_COORDINATOR_HOST = "any-sync-coordinator"
ANY_SYNC_COORDINATOR_PORT = "1004"
ANY_SYNC_COORDINATOR_ADDRESSES = "any-sync-coordinator:1004"
ANY_SYNC_COORDINATOR_QUIC_PORT = "1014"
ANY_SYNC_COORDINATOR_QUIC_ADDRESSES = "any-sync-coordinator:1014"
ANY_SYNC_COORDINATOR_DEFAULT_LIMITS_SPACE_MEMBERS_READ = "1000"
ANY_SYNC_COORDINATOR_DEFAULT_LIMITS_SPACE_MEMBERS_WRITE = "1000"
ANY_SYNC_COORDINATOR_DEFAULT_LIMITS_SHARED_SPACES_LIMIT = "1000"
ANY_SYNC_FILENODE_HOST = "any-sync-filenode"
ANY_SYNC_FILENODE_PORT = "1005"
ANY_SYNC_FILENODE_ADDRESSES = "any-sync-filenode:1005"
ANY_SYNC_FILENODE_QUIC_PORT = "1015"
ANY_SYNC_FILENODE_QUIC_ADDRESSES = "any-sync-filenode:1015"
ANY_SYNC_FILENODE_DEFAULT_LIMIT = "1099511627776"
ANY_SYNC_CONSENSUSNODE_HOST = "any-sync-consensusnode"
ANY_SYNC_CONSENSUSNODE_PORT = "1006"
ANY_SYNC_CONSENSUSNODE_ADDRESSES = "any-sync-consensusnode:1006"
ANY_SYNC_CONSENSUSNODE_QUIC_PORT = "1016"
ANY_SYNC_CONSENSUSNODE_QUIC_ADDRESSES = "any-sync-consensusnode:1016"
MONGO_1_PORT = "27001"
MONGO_CONNECT = "mongodb://mongo-1:27001"
MONGO_REPLICA_SET = "rs0"
MONGO_URL = "mongodb://mongo-1:27001/?replicaSet=rs0"
REDIS_HOST = "redis"
REDIS_PORT = "6379"
REDIS_URL = "redis://redis:6379?dial_timeout=3&read_timeout=6s"
REDIS_MAXMEMORY = "256mb"
AWS_ACCESS_KEY_ID = "myground_anytype_minio"
AWS_SECRET_ACCESS_KEY = "myground-anytype-minio-secret"
MINIO_BUCKET = "anytype"
MINIO_PORT = "9000"
MINIO_WEB_PORT = "9001"
STORAGE_DIR = "/code/storage"
ANY_SYNC_DAEMONS_MEMORY_LIMIT = "500M"

[[storage.volumes]]
name = "config"
container_path = "/code/etc"
description = "Generated Anytype network configuration, including client.yml"

[[storage.volumes]]
name = "data"
container_path = "/code/storage"
description = "Anytype sync data for MongoDB, Redis, MinIO, and any-sync nodes"
