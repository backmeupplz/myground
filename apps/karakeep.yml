services:
  karakeep:
    image: ghcr.io/karakeep-app/karakeep:${KARAKEEP_VERSION}
    container_name: myground-karakeep
    restart: unless-stopped
    ports:
      - "${BIND_IP}:${EXIT_PORT}:3000"
    volumes:
      - ${STORAGE_data}:/data
    environment:
      DATA_DIR: "/data"
      NEXTAUTH_URL: "${APP_PUBLIC_URL}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      MEILI_ADDR: "http://meilisearch:7700"
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      BROWSER_WEB_URL: "http://chrome:9222"
      LOG_LEVEL: "${LOG_LEVEL}"
      DB_WAL_MODE: "${DB_WAL_MODE}"
    depends_on:
      - meilisearch
      - chrome

  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    container_name: myground-karakeep-chrome
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars

  meilisearch:
    image: getmeili/meilisearch:v1.41.0
    container_name: myground-karakeep-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY}"
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${STORAGE_meilisearch}:/meili_data
