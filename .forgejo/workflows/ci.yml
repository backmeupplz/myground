name: CI

on:
  push:
    branches: [master]
    paths-ignore: [website/**, docs/**, "*.md"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Our pushes and PRs run on the Mac runners with a persistent, incremental target dir; outsider PRs (bridged in by
    # the `github` bot) never touch the Mac and run on Linux.
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude","radiant"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      # Creating a backup job runs a best-effort `docker run restic init`; keep the tests from reaching a real daemon.
      DOCKER_HOST: unix:///nonexistent.sock
    steps:
      # Actions pinned to a commit: the runners cache those, a tag is fetched from GitHub every job
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Persistent target and source dirs (Mac)
        if: runner.os == 'macOS'
        run: |
          # One per runner instance (each runs one job at a time); wiped past 10 GB, since cargo never prunes it.
          d="$RUNNER_TOOL_CACHE/myground-target"
          [ ! -d "$d" ] || [ "$(du -sm "$d" | cut -f1)" -lt 10000 ] || rm -rf "$d"
          echo "CARGO_TARGET_DIR=$d" >> "$GITHUB_ENV"
          # Every job checks out to a new path, and rustc drops its incremental cache when the path changes (a full
          # recompile of the crate). So the build runs in one fixed copy per runner instance. Copied by content (-c,
          # no -t): unchanged files keep their old mtimes, so cargo only rebuilds what the PR changed.
          src="$RUNNER_TOOL_CACHE/myground-src"
          mkdir -p "$src"
          rsync -rlpc --delete --exclude /.git --exclude /target --exclude node_modules --exclude /web/dist ./ "$src/"
          echo "SRC=$src" >> "$GITHUB_ENV"
          # Cargo's package-cache lock lives in CARGO_HOME, which all runner instances share: every cargo command
          # waited seconds on other jobs' cargo. One CARGO_HOME per instance (shared by its repos) never waits.
          echo "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo-home" >> "$GITHUB_ENV"
      - name: Temp dir off /tmp (Linux)
        if: runner.os == 'Linux'
        # the app refuses storage paths under /tmp and /root (the job's HOME), and the install tests put storage in a
        # temp dir
        run: mkdir -p "$GITHUB_WORKSPACE/.tmp" && echo "TMPDIR=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: runner.os == 'Linux'
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.os == 'Linux'
      - name: Website, format, web UI, clippy and tests
        run: |
          website() {
            cd "$GITHUB_WORKSPACE"
            # The Pages workflow fills {{APP_COUNT}} from apps/*.toml; a hardcoded count drifts as apps are added.
            if grep -rnE '[0-9]+\+?,? (curated|self-hosted|apps)([^a-z-]|$)' website; then echo "use {{APP_COUNT}} for the app count" >&2; return 1; fi
            tools/website-app-count.sh
            if grep -rn '{{APP_COUNT}}' website; then return 1; fi
            git checkout -- website
            # every apps/*.toml needs a docs table row and a homepage card
            tools/check-website-apps.sh
          }
          cd "${SRC:-.}"
          rustc --version; bun --version
          cargo fmt --check
          (cd web && bun install --frozen-lockfile)
          # Everything that doesn't need the test build runs beside it: the website checks, the web build (the API
          # tests serve web/dist; it only has to exist to compile), typecheck and vitest, and clippy (own target dir,
          # so it doesn't wait on the build lock). Each one's output is printed once all are done.
          mkdir -p web/dist
          (cd web && bun run build) > "$RUNNER_TEMP/web.log" 2>&1 &
          web=$!
          pids= n=0
          run() { n=$((n+1)); "$@" > "$RUNNER_TEMP/out.$n.log" 2>&1 & pids="$pids $!"; }
          run website
          run sh -c 'cd web && bunx tsc --noEmit'
          run sh -c 'cd web && bun run test'
          run env CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/clippy" cargo clippy --locked --all-targets
          ok=0
          cargo test --locked --no-run > "$RUNNER_TEMP/build.log" 2>&1 || ok=1; cat "$RUNNER_TEMP/build.log"
          wait $web || ok=1; cat "$RUNNER_TEMP/web.log"
          [ $ok = 0 ] || { wait; cat "$RUNNER_TEMP"/out.*.log; exit 1; }
          # Then every test binary and the doctests at once (cargo test would run them one after another).
          grep -q '^ *Executable ' "$RUNNER_TEMP/build.log" || { echo "no test binaries in the build output" >&2; exit 1; }
          for exe in $(sed -n 's/^ *Executable .*(\(.*\))$/\1/p' "$RUNNER_TEMP/build.log"); do run "$exe"; done
          run cargo test --locked --doc
          for p in $pids; do wait $p || ok=1; done
          cat "$RUNNER_TEMP"/out.*.log
          [ $ok = 0 ]
